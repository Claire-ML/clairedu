<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Minn Lee</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Caveat:wght@600&family=Gaegu:wght@700&display=swap">
<style>
/* Layout: plain white product-page — slim nav, big headline left, ruled menu list left, a loose cluster of sticky notes right */
:root {
  --bg: #ffffff;
  --ink: #111111;
  --muted: #6b6b6b;
  --line: #d9d9d9;
  /* Note colors taken from the "Maybe Happy Ending" poster: blush pink, navy line-art, pale blue, butter, white */
  --n-pink: #f6c6c4;
  --n-navy: #2d3a6b;
  --n-blue: #cfdcef;
  --n-butter: #f6e3b4;
  --n-white: #fdf7f5;
  --n-ink: #1f2747;
  --f-body: "Inter", "Noto Sans KR", "Helvetica Neue", Arial, "Malgun Gothic", system-ui, sans-serif;
  --f-hand: "Caveat", "Gaegu", "Comic Sans MS", cursive;
  color-scheme: light; /* single light look by request: always a white page */
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
html[lang="ko"] body { word-break: keep-all; overflow-wrap: break-word; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--n-navy); outline-offset: 3px; border-radius: 4px; }

.gutter {
  padding-left: max(32px, env(safe-area-inset-left, 0px));
  padding-right: max(32px, env(safe-area-inset-right, 0px));
}
.container { max-width: 1200px; margin: 0 auto; }

/* Nav */
.nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 16px; }
.nav-left { display: flex; align-items: center; gap: 28px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 600; text-decoration: none; font-size: 15px; }
.logo i { width: 22px; height: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.logo i span { border-radius: 50% 50% 50% 0; }
.logo i span:nth-child(1) { background: var(--n-pink); }
.logo i span:nth-child(2) { background: var(--n-navy); border-radius: 50%; }
.logo i span:nth-child(3) { background: var(--n-blue); }
.logo i span:nth-child(4) { background: var(--n-butter); border-radius: 0 50% 50% 50%; }
.links { display: flex; gap: 22px; font-size: 13.5px; }
.links button { background: none; border: 0; padding: 0; }
.links button:hover { text-decoration: underline; text-underline-offset: 3px; }
.nav-right { display: flex; gap: 8px; align-items: center; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; border-radius: 8px; padding: 8px 14px;
  font-size: 13.5px; font-weight: 500; text-decoration: none; border: 1px solid var(--ink); background: none;
}
.btn.solid { background: var(--ink); color: var(--bg); }
.btn svg { width: 14px; height: 14px; fill: currentColor; }

.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.lang button {
  background: none; border: 0; border-radius: 6px; padding: 5px 10px; font-size: 12.5px; font-weight: 600; color: var(--muted);
}
.lang button[aria-pressed="true"] { background: var(--n-pink); color: var(--n-ink); }

/* Home */
.hero-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 56px; align-items: center; padding-block: 72px 8px; }
.hero { display: grid; gap: 18px; max-width: 640px; }
.hero h1 { margin: 0; font-size: clamp(40px, 4.6vw, 60px); font-weight: 500; letter-spacing: -.03em; line-height: 1.1; text-wrap: balance; }
html[lang="ko"] .hero h1 { letter-spacing: -.04em; }
.hero p { margin: 0; font-size: 17px; line-height: 1.6; }
.hero .cta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.hero .cta .btn { padding: 11px 18px; font-size: 14.5px; }
.portrait { position: relative; width: 196px; margin: 0 24px 0 0; }
.portrait::before {
  content: ""; position: absolute; inset: 14px -16px -14px 16px; background: var(--n-pink); transform: rotate(3deg);
}
.portrait img {
  position: relative; display: block; width: 100%; height: auto; max-width: 100%; aspect-ratio: 3 / 4; object-fit: cover;
  background: #f2f2f2; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 14px 30px -18px rgba(0,0,0,.4);
}

.stage { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 48px; padding-block: 48px 96px; align-items: start; }

.menu { display: grid; }
.menu button {
  background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left;
  padding: 11px 0; font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 10px;
}
.menu button .dot { width: 14px; height: 14px; border-radius: 4px; flex: none; border: 1px solid rgba(0,0,0,.08); }
.menu button:hover, .menu button.on { font-weight: 600; }
.menu button.on { border-bottom-color: var(--ink); }
.menu-note { margin: 18px 0 0; color: var(--muted); font-size: 13.5px; }

.board { position: relative; min-height: 440px; }
.note {
  position: absolute; width: 190px; aspect-ratio: 1; padding: 16px; border: 0; text-align: left;
  display: flex; flex-direction: column; justify-content: space-between; color: var(--n-ink);
  box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 10px 24px -14px rgba(0,0,0,.35);
  transition: transform .2s ease, box-shadow .2s ease;
}
.note .cap { font-size: 11.5px; font-weight: 500; opacity: .75; }
.note .big { font-size: 17px; font-weight: 600; line-height: 1.3; }
.note .hand { font-family: var(--f-hand); font-size: 30px; line-height: 1.05; }
.note .foot { font-size: 11.5px; opacity: .7; display: flex; justify-content: space-between; }
.note:hover, .note.lift { transform: translateY(-6px) rotate(0deg) !important; box-shadow: 0 2px 4px rgba(0,0,0,.08), 0 22px 36px -16px rgba(0,0,0,.4); z-index: 5; }
.n1 { background: var(--n-pink); left: 4%; top: 120px; transform: rotate(-3deg); }
.n2 { background: var(--n-navy); color: #fff; left: 30%; top: 20px; transform: rotate(2deg); }
.n3 { background: var(--n-blue); left: 56%; top: 130px; transform: rotate(-1.5deg); }
.n4 { background: var(--n-butter); left: 26%; top: 240px; transform: rotate(3deg); }
.n5 { background: var(--n-white); left: 72%; top: 10px; transform: rotate(4deg); outline: 1px solid #e7d6d3; }
.tagc { position: absolute; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 4px; color: #fff; white-space: nowrap; }
.tagc::before {
  content: ""; position: absolute; left: -10px; top: -10px; width: 0; height: 0;
  border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 11px solid;
  transform: rotate(-35deg);
}
.tag-a { background: #d9837f; left: calc(4% + 150px); top: 104px; }
.tag-a::before { border-bottom-color: #d9837f; }
.tag-b { background: var(--n-navy); left: calc(56% + 160px); top: 300px; }
.tag-b::before { border-bottom-color: var(--n-navy); }
.portrait .tagc { left: -14px; bottom: 26px; background: var(--n-navy); }
.portrait .tagc::before { border-bottom-color: var(--n-navy); }

/* Detail */
.detail { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 48px; padding-block: 56px 96px; align-items: start; }
.detail aside { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); }
.back { background: none; border: 0; padding: 0; color: var(--muted); font-size: 13.5px; margin-bottom: 24px; }
.back:hover { color: var(--ink); }
.who { margin-bottom: 20px; }
.who b { display: block; font-size: 24px; font-weight: 500; letter-spacing: -.02em; }
.who span { color: var(--muted); font-size: 13.5px; }

.panel { display: grid; gap: 8px; min-width: 0; }
.panel h2 { margin: 0 0 8px; font-size: 40px; font-weight: 500; letter-spacing: -.03em; line-height: 1.15; }
.panel .lead { margin: 0 0 16px; color: var(--muted); font-size: 16px; }

.paper { background: var(--n-pink); color: var(--n-ink); padding: 24px; border-radius: 4px; display: grid; gap: 8px; margin-bottom: 8px; }
.paper .meta { font-size: 12px; font-weight: 600; letter-spacing: .02em; }
.paper h3 { margin: 0; font-size: 19px; font-weight: 600; line-height: 1.45; }
.paper p { margin: 0; font-size: 13.5px; }

.item { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 24px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.when { color: var(--muted); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.what { display: grid; gap: 2px; min-width: 0; }
.what h3 { margin: 0; font-size: 16.5px; font-weight: 600; }
.what .org { font-size: 14.5px; }
.what p, .what ul { margin: 2px 0 0; color: var(--muted); font-size: 14.5px; }
.what ul { padding-left: 18px; }
.chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--n-blue); color: var(--n-ink); margin-left: 8px; vertical-align: 2px; }

.state { padding-block: 120px; color: var(--muted); text-align: center; }

footer { color: var(--muted); font-size: 12.5px; padding-block: 24px 32px; border-top: 1px solid var(--line); }

@media (max-width: 900px) {
  .links { display: none; }
  .stage, .detail { grid-template-columns: minmax(0, 1fr); gap: 32px; }
  .detail aside { position: static; }
  .hero-row { grid-template-columns: minmax(0, 1fr); gap: 40px; padding-block: 40px 8px; }
  .portrait { width: min(170px, 60%); order: -1; }
}
@media (max-width: 1140px) {
  .board { min-height: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .note { position: static; width: auto; transform: none !important; }
  .note:hover { transform: translateY(-4px) !important; }
  .board .tagc { display: none; }
}
@media (max-width: 560px) {
  .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .nav-right .btn:not(.solid) { display: none; }
  .item { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .panel h2 { font-size: 32px; }
}
@media (prefers-reduced-motion: reduce) { .note { transition: none; } }
</style>
</head>
<body>
<header class="gutter">
  <div class="container nav">
    <div class="nav-left">
      <a class="logo" href="#home"><i><span></span><span></span><span></span><span></span></i><span data-t="name">Minn Lee</span></a>
      <nav class="links" id="topLinks" aria-label="Sections"></nav>
    </div>
    <div class="nav-right">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="ko" aria-pressed="false">KO</button>
      </div>
      <button class="btn" type="button" data-go="research" data-ui="viewCv">View CV</button>
      <a class="btn solid" id="liTop" href="#" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </div>
</header>

<div id="state" class="gutter state">Loading…</div>

<!-- HOME -->
<main id="view-home" class="gutter" hidden>
  <div class="container">
    <div class="hero-row">
      <section class="hero">
        <h1 id="headline"></h1>
        <p id="intro"></p>
        <div class="cta">
          <a class="btn solid" id="liHero" href="#" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.75h4v11H3v-11zm6.5 0h3.8v1.5h.06c.53-1 1.83-2.06 3.77-2.06 4.03 0 4.77 2.65 4.77 6.1v5.46h-4v-4.84c0-1.16-.02-2.64-1.61-2.64-1.61 0-1.86 1.26-1.86 2.56v4.92h-4v-11z"/></svg>
            <span data-ui="connect">Connect on LinkedIn</span>
          </a>
          <button class="btn" type="button" data-go="research" data-ui="seeProfile">See my full profile →</button>
        </div>
      </section>
      <figure class="portrait">
        <img id="photo" alt="" width="354" height="472">
        <span class="tagc" aria-hidden="true" data-t="name"></span>
      </figure>
    </div>

    <section class="stage">
      <div>
        <div class="menu" id="homeMenu"></div>
        <p class="menu-note" data-ui="menuNote"></p>
      </div>
      <div class="board" id="board"></div>
    </section>
  </div>
</main>

<!-- DETAIL -->
<main id="view-detail" class="gutter" hidden>
  <div class="container detail">
    <aside>
      <button class="back" type="button" data-home data-ui="back">← Back to home</button>
      <div class="who"><b data-t="name"></b><span data-t="affiliation"></span></div>
      <div class="menu" id="detailMenu"></div>
    </aside>
    <div id="panel" class="panel"></div>
  </div>
</main>

<footer class="gutter"><div class="container" id="foot"></div></footer>

<script>
(function () {
  var SECTIONS = ['research', 'experience', 'training', 'education', 'honors'];
  var COLORS = { research: '--n-pink', experience: '--n-navy', training: '--n-blue', education: '--n-butter', honors: '--n-white' };
  var UI = {
    en: {
      short: { research: 'Research', experience: 'Experience', training: 'Training', education: 'Education', honors: 'Honors' },
      long: { research: 'Research', experience: 'Work experience', training: 'Training & activities', education: 'Education', honors: 'Honors & scholarships' },
      viewCv: 'View CV', connect: 'Connect on LinkedIn', seeProfile: 'See my full profile →',
      menuNote: 'Pick a section or a note to open the details.', back: '← Back to home',
      tagA: 'Minn', tagB: 'Youth Studies', photoAlt: 'Portrait of Minn Lee',
      footer: '© 2026 Minn Lee · Myongji University, Seoul',
      error: 'Could not load profile.json. Open the site through GitHub Pages or a local web server.'
    },
    ko: {
      short: { research: '연구', experience: '실무', training: '교육', education: '학력', honors: '수상' },
      long: { research: '연구 이력', experience: '실무 이력', training: '교육 · 활동 이력', education: '학력사항', honors: '수상 · 장학' },
      viewCv: '이력 보기', connect: 'LinkedIn에서 연결하기', seeProfile: '전체 이력 보기 →',
      menuNote: '항목이나 노트를 누르면 자세한 내용을 볼 수 있어요.', back: '← 처음으로',
      tagA: '이민', tagB: '청소년학', photoAlt: '이민 프로필 사진',
      footer: '© 2026 이민 · 명지대학교',
      error: 'profile.json을 불러오지 못했습니다. GitHub Pages 주소나 로컬 웹 서버로 열어 주세요.'
    }
  };

  var data = null;
  var lang = 'en';
  try { var saved = localStorage.getItem('lang'); if (saved === 'ko' || saved === 'en') lang = saved; } catch (e) {}

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  // Pick the current language from a {en, ko} pair, falling back to the other language
  function L(v) {
    if (v == null) return '';
    if (typeof v === 'string') return v;
    return v[lang] || v.en || v.ko || '';
  }
  function $(id) { return document.getElementById(id); }
  function cleanPath(p) { return String(p || '').replace(/^\/+/, ''); }

  function noteHTML(key, i) {
    var n = (data.notes || {})[key] || {};
    var cls = 'note n' + (i + 1);
    var body = key === 'training'
      ? '<span class="hand">' + esc(L(n.text)) + '</span>'
      : '<span class="big">' + esc(L(n.text)) + '</span>';
    return '<button class="' + cls + '" type="button" data-go="' + key + '" id="note-' + key + '">' +
      '<span class="cap">' + esc(UI[lang].long[key]) + '</span>' + body +
      '<span class="foot"><span>' + esc(L(n.foot)) + '</span><span aria-hidden="true">→</span></span></button>';
  }

  function menuHTML(withNote) {
    return SECTIONS.map(function (k) {
      return '<button type="button" data-go="' + k + '"' + (withNote ? ' data-n="note-' + k + '"' : '') + '>' +
        '<span class="dot" style="background:var(' + COLORS[k] + ')"></span>' + esc(UI[lang].long[k]) + '</button>';
    }).join('');
  }

  function itemHTML(it) {
    var status = L(it.status);
    var org = L(it.org);
    var desc = L(it.description);
    var details = (it.details || []).map(L).filter(Boolean);
    return '<div class="item"><div class="when">' + esc(L(it.period)) + '</div><div class="what">' +
      '<h3>' + esc(L(it.title)) + (status ? '<span class="chip">' + esc(status) + '</span>' : '') + '</h3>' +
      (org ? '<span class="org">' + esc(org) + '</span>' : '') +
      (desc ? '<p>' + esc(desc) + '</p>' : '') +
      (details.length ? '<ul>' + details.map(function (d) { return '<li>' + esc(d) + '</li>'; }).join('') + '</ul>' : '') +
      '</div></div>';
  }

  function paperHTML(p) {
    var authors = esc(L(p.authors));
    var me = esc(L(p.me));
    if (me) authors = authors.replace(me, '<b>' + me + '</b>');
    var cite = authors + '. (' + esc(p.year) + '). ' +
      (lang === 'ko' ? esc(L(p.title)) + '. ' : '') +
      '<i>' + esc(L(p.journal)) + '</i>' +
      (p.volume ? ', ' + esc(p.volume) : '') + (p.pages ? ', ' + esc(p.pages) : '') + '.';
    return '<article class="paper"><span class="meta">' + esc(L(p.tag)) + '</span>' +
      '<h3>' + esc(L(p.title)) + '</h3><p>' + cite + '</p></article>';
  }

  function renderStatic() {
    var u = UI[lang];
    document.documentElement.lang = lang;
    document.title = L(data.name) || 'Minn Lee';
    document.querySelectorAll('[data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false'); });
    document.querySelectorAll('[data-ui]').forEach(function (el) { el.textContent = u[el.dataset.ui]; });
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = L(data[el.dataset.t]); });
    $('topLinks').innerHTML = SECTIONS.map(function (k) { return '<button type="button" data-go="' + k + '">' + esc(u.short[k]) + '</button>'; }).join('');
    $('liTop').href = data.linkedin; $('liHero').href = data.linkedin;
    $('headline').textContent = L(data.headline);
    $('intro').textContent = L(data.intro);
    $('photo').src = cleanPath(data.photo);
    $('photo').alt = u.photoAlt;
    $('homeMenu').innerHTML = menuHTML(true);
    $('board').innerHTML = SECTIONS.map(noteHTML).join('') +
      '<span class="tagc tag-a" aria-hidden="true">' + esc(u.tagA) + '</span>' +
      '<span class="tagc tag-b" aria-hidden="true">' + esc(u.tagB) + '</span>';
    $('detailMenu').innerHTML = menuHTML(false);
    $('foot').textContent = u.footer;
  }

  function renderPanel(key) {
    var html = '<h2>' + esc(UI[lang].long[key]) + '</h2>';
    var lead = L((data.leads || {})[key]);
    if (lead) html += '<p class="lead">' + esc(lead) + '</p>';
    if (key === 'research') html += (data.publications || []).map(paperHTML).join('');
    html += (data[key] || []).map(itemHTML).join('');
    $('panel').innerHTML = html;
    document.querySelectorAll('#detailMenu button').forEach(function (b) { b.classList.toggle('on', b.dataset.go === key); });
  }

  function route(scroll) {
    var h = (location.hash || '').slice(1);
    var on = SECTIONS.indexOf(h) !== -1;
    $('view-home').hidden = on;
    $('view-detail').hidden = !on;
    if (on) renderPanel(h);
    if (scroll) window.scrollTo(0, 0);
  }

  function renderAll() { renderStatic(); route(false); }

  // One delegated listener covers buttons that are re-rendered on language change
  document.addEventListener('click', function (e) {
    var go = e.target.closest('[data-go]');
    if (go) { location.hash = go.dataset.go; return; }
    if (e.target.closest('[data-home]')) { location.hash = 'home'; return; }
    var lb = e.target.closest('[data-lang]');
    if (lb && data) {
      lang = lb.dataset.lang;
      try { localStorage.setItem('lang', lang); } catch (err) {}
      renderAll();
    }
  });
  document.addEventListener('mouseover', function (e) {
    var b = e.target.closest('#homeMenu button');
    document.querySelectorAll('.note.lift, #homeMenu button.on').forEach(function (el) { el.classList.remove('lift', 'on'); });
    if (b) { var n = $(b.dataset.n); if (n) n.classList.add('lift'); b.classList.add('on'); }
  });
  window.addEventListener('hashchange', function () { if (data) route(true); });

  fetch('profile.json', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (json) {
      data = json;
      $('state').hidden = true;
      renderAll();
    })
    .catch(function () { $('state').textContent = UI[lang].error; });
})();
</script>

</body>
</html>
